[env:esp32dev]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
  256dpi/MQTT@2.5.2
  bblanchon/ArduinoJson@7.4.2
build_flags =
  -D SMARTROOM_BOARD_ESP32=1
  -D CORE_DEBUG_LEVEL=1
build_unflags =
  -std=gnu++11
build_src_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Werror
