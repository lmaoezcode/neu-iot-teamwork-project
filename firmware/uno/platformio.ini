[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -D SMARTROOM_BOARD_UNO=1
  -D SMARTROOM_ENABLE_MQ2=0
  -D SMARTROOM_ENABLE_FLAME_SENSOR=0
  -D SMARTROOM_FLAME_ACTIVE_LOW=1
  -D SMARTROOM_ENABLE_BUZZER=0
